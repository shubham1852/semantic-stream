# ==============================================================================
# SemanticStream — Docker Compose Orchestration
# Single command startup: docker-compose up --build
# ==============================================================================

version: "3.9"

services:

  # ── Backend (FastAPI) ───────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: runtime
    container_name: semanticstream_backend
    restart: unless-stopped
    env_file: .env
    environment:
      - DATABASE_URL=${DATABASE_URL:-sqlite+aiosqlite:///./semanticstream.db}
      - DEBUG=${DEBUG:-false}
      - LOG_JSON=${LOG_JSON:-true}
    ports:
      - "8000:8000"
    volumes:
      - ./backend/storage:/app/storage   # Persist uploads & processed files
      - ./backend:/app                   # Dev hot-reload (remove in prod)
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - semanticstream_net

  # ── Frontend (React + Vite dev server) ─────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: runtime
    container_name: semanticstream_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - semanticstream_net

networks:
  semanticstream_net:
    driver: bridge
